name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Layouts, sensors, and an emulated display on every kind of I2C link
        run: python -m unittest discover -s tests -v
      - name: The README pictures are up to date
        run: python tools/make_previews.py --check
      - name: Installer syntax
        run: bash -n setup.sh && shellcheck -S warning setup.sh
